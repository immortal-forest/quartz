# quartz: what happens when you're away (hypridle, started by quartz's Hyprland
# config). quartz's "Stay awake" (Settings › General) and playing videos pause it.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

# No lock_cmd: hypridle runs it on every "lock the session" signal, and quartz
# already locks on that signal itself. Set to `loginctl lock-session`, each lock
# would send the signal again and lock you straight back in after unlocking.
general {
    before_sleep_cmd = loginctl lock-session             # locked before the laptop sleeps
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {                                               # 5 min: dim the screen
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {                                               # 10 min: lock (quartz's lock screen)
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {                                               # 15 min: screen off
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {                                               # 30 min: sleep
    timeout = 1800
    on-timeout = systemctl suspend
}
